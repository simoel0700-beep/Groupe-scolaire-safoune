<title>مؤسسة صفوان الخصوصية</title>
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --text:#1c2333; --muted:#6b7280;
  --brand:#2454ff; --brand-dark:#1a3fd6; --accent:#ffb020; --border:#e6e9f2;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111522; --card:#1a2035; --text:#eef1f8; --muted:#9aa3b5; --border:#2a3252;
  }
}
:root[data-theme="dark"]{
  --bg:#111522; --card:#1a2035; --text:#eef1f8; --muted:#9aa3b5; --border:#2a3252;
}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
*{box-sizing:border-box;}
body{
  margin:0; height:100%; background:var(--bg); color:var(--text);
  font-family:"Tahoma","Segoe UI",system-ui,sans-serif;
}
header{
  position:sticky; top:0; z-index:5; background:linear-gradient(135deg,var(--brand),var(--brand-dark));
  color:#fff; padding:calc(14px + env(safe-area-inset-top,0px)) 16px 16px;
}
header h1{margin:0; font-size:1.15rem;}
header p{margin:4px 0 0; font-size:.8rem; opacity:.9;}
.wrap{max-width:640px; margin:0 auto; padding:14px 14px 40px;}
.teacher-bar{display:flex; gap:8px; justify-content:flex-end; margin-top:10px;}
button{
  font-family:inherit; border:none; border-radius:10px; padding:9px 14px; font-size:.85rem;
  cursor:pointer; background:#fff2; color:#fff; backdrop-filter:blur(2px);
}
button.primary{background:var(--accent); color:#2b2100; font-weight:bold;}
.subject{
  background:var(--card); border:1px solid var(--border); border-radius:14px; margin-bottom:12px; overflow:hidden;
}
.subject > .head{
  display:flex; align-items:center; gap:10px; padding:14px; cursor:pointer; user-select:none;
}
.subject .icon{font-size:1.4rem;}
.subject .name{font-weight:bold; flex:1;}
.subject .count{font-size:.75rem; color:var(--muted);}
.subject .body{display:none; padding:0 14px 14px; border-top:1px solid var(--border);}
.subject.open .body{display:block;}
.item{
  background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin-top:10px;
}
.item h4{margin:0 0 4px; font-size:.92rem;}
.item p{margin:0; font-size:.85rem; color:var(--muted); white-space:pre-wrap;}
.item .rm{display:none; margin-top:8px; background:#ff3b3020; color:#c62828; padding:5px 10px; font-size:.75rem;}
.teacher .item .rm{display:inline-block;}
.add-btn{display:none; width:100%; margin-top:10px; background:var(--brand); color:#fff;}
.teacher .add-btn{display:block;}
.empty{font-size:.8rem; color:var(--muted); padding-top:10px;}
.overlay{
  position:fixed; inset:0; background:#00000066; display:none; align-items:center; justify-content:center; z-index:20; padding:20px;
}
.overlay.show{display:flex;}
.modal{
  background:var(--card); border-radius:14px; padding:18px; width:100%; max-width:420px; max-height:85vh; overflow:auto;
}
.modal h3{margin-top:0;}
.modal input, .modal textarea{
  width:100%; padding:10px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text);
  font-family:inherit; margin-bottom:10px; font-size:.9rem;
}
.modal textarea{min-height:110px; resize:vertical;}
.modal .row{display:flex; gap:8px; justify-content:flex-end; margin-top:6px;}
.modal .row button{background:var(--border); color:var(--text);}
.badge{
  position:fixed; bottom:calc(14px + env(safe-area-inset-bottom,0px)); right:14px; background:#22c55e; color:#fff;
  padding:8px 14px; border-radius:20px; font-size:.8rem; box-shadow:0 4px 12px #0003; display:none; z-index:15;
}
.badge.show{display:block;}
</style>
</head>
<body>

<header>
  <div class="wrap" style="padding:0;">
    <h1>🎓 مؤسسة صفوان الخصوصية</h1>
    <p>المواد الدراسية والدروس</p>
    <div class="teacher-bar">
      <button id="installBtn" class="primary" style="display:none;background:#fff;color:var(--brand-dark);">⬇️ تحميل التطبيق</button>
      <button id="teacherToggle">🔑 دخول الأستاذ</button>
    </div>
  </div>
</header>

<div class="wrap" id="subjectsWrap"></div>

<div class="overlay" id="loginOverlay">
  <div class="modal">
    <h3>دخول الأستاذ</h3>
    <input type="password" id="pwInput" placeholder="كلمة السر">
    <div class="row">
      <button onclick="closeOverlay('loginOverlay')">إلغاء</button>
      <button class="primary" onclick="tryLogin()" style="color:#2b2100;background:var(--accent)">دخول</button>
    </div>
  </div>
</div>

<div class="overlay" id="addOverlay">
  <div class="modal">
    <h3>إضافة درس</h3>
    <input type="text" id="itemTitle" placeholder="عنوان الدرس">
    <textarea id="itemBody" placeholder="محتوى الدرس أو الرابط أو الملاحظات..."></textarea>
    <div class="row">
      <button onclick="closeOverlay('addOverlay')">إلغاء</button>
      <button class="primary" onclick="saveItem()" style="color:#2b2100;background:var(--accent)">حفظ</button>
    </div>
  </div>
</div>

<div class="badge" id="savedBadge">تم الحفظ ✓</div>

    {id:"pc", icon:"🧪", name:"الفيزياء والكيمياء", items:[]},
    {id:"svt", icon:"🌱", name:"علوم الحياة والأرض", items:[]},
    {id:"hg", icon:"🗺️", name:"التاريخ والجغرافيا", items:[]},
    {id:"islam", icon:"🕌", name:"التربية الإسلامية", items:[]},
    {id:"en", icon:"📙", name:"اللغة الإنجليزية", items:[]},
    {id:"info", icon:"💻", name:"الإعلاميات", items:[]},
    {id:"sport", icon:"⚽", name:"التربية البدنية", items:[]}
  ]
};

let isTeacher = false;
let activeSubjectForAdd = null;
let artifactAPI = null;

function render(){
  const wrap = document.getElementById('subjectsWrap');
  wrap.className = 'wrap' + (isTeacher ? ' teacher' : '');
  wrap.innerHTML = '';
  state.subjects.forEach(s=>{
    const div = document.createElement('div');
    div.className = 'subject';
    div.innerHTML = `
      <div class="head" onclick="toggleSubject(this)">
        <span class="icon">${s.icon}</span>
        <span class="name">${s.name}</span>
        <span class="count">${s.items.length} درس</span>
      </div>
      <div class="body">
        ${s.items.length ? s.items.map((it,i)=>`
          <div class="item">
            <h4>${escapeHtml(it.title)}</h4>
            <p>${escapeHtml(it.body)}</p>
            <button class="rm" onclick="removeItem('${s.id}', ${i})">حذف</button>
          </div>`).join('') : '<div class="empty">لا توجد دروس بعد</div>'}
        <button class="add-btn" onclick="openAdd('${s.id}')">+ إضافة درس</button>
      </div>`;
    wrap.appendChild(div);
  });
}

function escapeHtml(str){
  const d = document.createElement('div'); d.innerText = str || ''; return d.innerHTML;
}

function toggleSubject(headEl){
  headEl.parentElement.classList.toggle('open');
}

function tryLogin(){
  const val = document.getElementById('pwInput').value;
  if(val === TEACHER_PASSWORD){
    isTeacher = true;
    closeOverlay('loginOverlay');
    document.getElementById('pwInput').value = '';
    document.getElementById('teacherToggle').textContent = '🚪 خروج الأستاذ';
    render();
  } else {
    alert('كلمة السر غير صحيحة');
  }
}

document.getElementById('teacherToggle').addEventListener('click', ()=>{
  if(isTeacher){
    isTeacher = false;
    document.getElementById('teacherToggle').textContent = '🔑 دخول الأستاذ';
    render();
  } else {
    document.getElementById('loginOverlay').classList.add('show');
  }
});

function openAdd(subjectId){
  activeSubjectForAdd = subjectId;
  document.getElementById('itemTitle').value = '';
  document.getElementById('itemBody').value = '';
  document.getElementById('addOverlay').classList.add('show');
}

function closeOverlay(id){
  document.getElementById(id).classList.remove('show');
}

async function saveItem(){
  const title = document.getElementById('itemTitle').value.trim();
  const body = document.getElementById('itemBody').value.trim();
  if(!title){ alert('اكتب عنوان الدرس'); return; }
  const subject = state.subjects.find(s=>s.id===activeSubjectForAdd);
  subject.items.push({title, body});
  closeOverlay('addOverlay');
  render();
  await persist();
}

async function removeItem(subjectId, index){
  if(!confirm('هل تريد حذف هذا الدرس؟')) return;
  const subject = state.subjects.find(s=>s.id===subjectId);
  subject.items.splice(index,1);
  render();
  await persist();
}

function showSaved(){
  const b = document.getElementById('savedBadge');
  b.classList.add('show');
  setTimeout(()=>b.classList.remove('show'), 1800);
}

async function persist(){
  try{ localStorage.setItem('safwan_state', JSON.stringify(state)); }catch(e){}
  if(artifactAPI){
    try{
      const doc = document.documentElement.outerHTML;
      const newDoc = doc.replace(
        /let state = [\s\S]*?;\n\nlet isTeacher/,
        'let state = ' + JSON.stringify(state) + ';\n\nlet isTeacher'
      );
      await artifactAPI.publish('<!DOCTYPE html>\n' + newDoc);
      showSaved();
    }catch(e){ showSaved(); }
  } else {
    showSaved();
  }
}

(async function init(){
  try{
    const saved = localStorage.getItem('safwan_state');
    if(saved) state = JSON.parse(saved);
  }catch(e){}
  render();
  try{
    if(window.claude && window.claude.use){
      artifactAPI = await window.claude.use('artifact');
    }
  }catch(e){ artifactAPI = null; }

  // تسجيل service worker بسيط (شرط ضروري فبعض المتصفحات باش يبان زر التحميل الحقيقي)
  try{
    const swCode = "self.addEventListener('fetch', e=>{});";
    const blob = new Blob([swCode], {type:'application/javascript'});
    const swUrl = URL.createObjectURL(blob);
    if('serviceWorker' in navigator){
      navigator.serviceWorker.register(swUrl).catch(()=>{});
    }
  }catch(e){}

  const installBtn = document.getElementById('installBtn');
  let deferredPrompt = null;

  window.addEventListener('beforeinstallprompt', (e)=>{
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = 'inline-block';
  });

  installBtn.addEventListener('click', async ()=>{
    if(deferredPrompt){
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBtn.style.display = 'none';
    } else {
      const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
      alert(isIOS
        ? 'فالآيفون: افتح زر المشاركة ⬆️ فوق Safari، ثم اختر "Add to Home Screen".'
        : 'اضغط على النقط ⋮ فوق المتصفح، ثم اختر "تثبيت التطبيق" أو "إضافة إلى الشاشة الرئيسية".');
    }
  });

  // فالآيفون ما كايناش نافذة تحميل تلقائية (قيد من Apple)، فكنبينو الزر يدوز لتعليمات فورية
  if(/iphone|ipad|ipod/i.test(navigator.userAgent) && !window.navigator.standalone){
    installBtn.style.display = 'inline-block';
  }
})();
</script>
</body>
</html>
